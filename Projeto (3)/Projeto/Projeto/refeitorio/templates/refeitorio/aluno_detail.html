{% extends "refeitorio/base.html" %}

{% block conteudo %}

<div class="post-entry">
    <div class="card">
        <div class="card-header">
            {{ aluno.nome_aluno }}
        </div>

        <div class="card-body">
            <p>Código: {{ aluno.pk }}</p>
            <p>Turma: {{ aluno.turma }}</p>
            <p>Matrícula: {{ aluno.matricula }}</p>
            <p>Situação: {{ aluno.situacao }}</p>

            <a href="{% url 'aluno_list' %}" class="btn btn-primary">
                Voltar
            </a>
        </div>
    </div>
</div>

{% endblock %}
